# Only recommended tunable parameters are listed here (reference table).
# Usage: manually sync selected values to script CLI arguments or default.yaml.
# Parameters not listed here should stay at their current defaults.

global:
  seed: 42
  use_local_files_only: true   # Recommended: from_pretrained(..., local_files_only=True)

data:
  text_col: review
  label_col: label
  max_len: 128                 # Try: 128 / 192

train_binary_e0:
  script: train/train_roberta_binary.py
  model_name: models/chinese-roberta-wwm-ext
  epochs: 2                    # You can increase from 1 to 2 or 3.
  batch_size: 16               # If GPU memory is limited, try 8/4.
  lr: 2.0e-5                   # Try: 1e-5 / 2e-5 / 3e-5
  weight_decay: 0.01
  warmup_ratio: 0.10           # Try: 0.06 / 0.10
  fp16: false

eval_binary:
  script: train/eval_binary.py
  batch_size: 64
  max_len: 128

nbest_generation:
  script: pipeline/run_pkuseg.py
  # Matches NormalizeConfig (pipeline/normalize_top10.py)
  m: 2                         # Maximum correction positions attempted per sentence
  beam_size: 50
  topn: 10                     # Candidate count cap (try 5 / 10)
  topk_char: 15
  alpha: 1.0                   # final_score = alpha*lm + beta*prior - lamb*edit
  beta: 0.1
  lamb: 1.0
  delta: 0.3                   # gating threshold
  tau: 2.0                     # softmax temperature

infer_nbest_ablation:
  script: train/infer_with_nbest.py
  label_col: label
  top_k: 5                     # Suggested for newer setup: 3 / 5 / 10
  alpha: 1.5                   # Weight recalibration w^alpha; try 1.0 / 1.5 / 2.0
  fallback_orig: true          # Enable low-confidence fallback to the original sentence
  w1_threshold: 0.35
  margin_threshold: 0.08
  batch_size: 64
  max_len: 128

ablation_grid_recommend:
  # Recommended minimal ablation combinations
  - {top_k: 10, alpha: 1.0, fallback_orig: false}
  - {top_k: 5,  alpha: 1.5, fallback_orig: false}
  - {top_k: 5,  alpha: 2.0, fallback_orig: false}
  - {top_k: 5,  alpha: 2.0, fallback_orig: true,  w1_threshold: 0.35, margin_threshold: 0.08}